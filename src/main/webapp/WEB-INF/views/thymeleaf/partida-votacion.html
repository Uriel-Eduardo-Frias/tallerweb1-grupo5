
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elegir categoría - TRIVIA</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">

<div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">

        <h1 class="mb-3">TRIVIA</h1>

        <h2 class="mb-4">
            Ronda
            <span th:text="${partida.rondaActual}">1</span>
            /
            <span th:text="${partida.totalRondas}">5</span>
        </h2>

        <!-- Resultado de la respuesta anterior -->
        <div th:if="${esCorrecta != null}" class="mb-4">

            <h4 th:if="${esCorrecta}"
                class="text-success fw-bold">
                ¡Respuesta correcta!
            </h4>

            <h4 th:unless="${esCorrecta}"
                class="text-danger fw-bold">
                ¡Respuesta incorrecta!
            </h4>

            <p class="mt-2">
                La respuesta correcta era:
                <strong th:text="${textoCorrecto}">
                    Respuesta correcta
                </strong>
            </p>

            <p th:if="${mensaje != null}"
               class="text-muted"
               th:text="${mensaje}">
            </p>

            <hr>
        </div>

        <h3 class="mb-3">Elegí una categoría</h3>

        <p class="text-muted">
            Cada jugador puede votar una sola vez.
            Cuando todos hayan votado, comenzará la pregunta.
        </p>

        <!-- Registrar un voto -->
        <form th:action="@{/partida/{id}/votar-categoria(id=${partida.id})}"
              method="POST"
              class="d-grid gap-3 mt-3">

            <button th:each="entry : ${mapaDeCategorias}"
                    type="submit"
                    name="categoriaId"
                    th:value="${entry.key}"
                    th:text="${entry.value.nombre}"
                    class="btn btn-primary">
                Categoría
            </button>

        </form>

        <p id="estadoConexion" class="text-muted small mt-3">
            Conectando con la partida...
        </p>

    </div>
</div>

<!-- WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>

<script th:inline="javascript">
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const partidaId = /*[[${partida.id}]]*/ "";

    const urlPregunta =
        /*[[@{/partida/{id}/pregunta(id=${partida.id})}]]*/ "";

    const urlVotacion =
        /*[[@{/partida/{id}/votacion-categoria(id=${partida.id})}]]*/ "";

    const estadoConexion = document.getElementById("estadoConexion");

    const cliente = new StompJs.Client({
        brokerURL: "ws://localhost:8080/spring/ws",
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        estadoConexion.textContent = "Conectado a la partida.";

        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            // Ignorar eventos de otras partidas.
            if (String(evento.partidaId) !== String(partidaId)) {
                return;
            }

            if (evento.tipo === "VOTACION_CATEGORIA_FINALIZADA") {
                window.location.href = urlPregunta;
                return;
            }

            if (evento.tipo === "NUEVA_VOTACION_CATEGORIA") {
                window.location.href = urlVotacion;
                return;
            }

            if (evento.tipo === "PARTIDA_FINALIZADA") {
                estadoConexion.textContent = "¡La partida terminó!";
            }
        });
    };

    cliente.onStompError = function () {
        estadoConexion.textContent =
            "Error de comunicación con la partida.";
    };

    cliente.onWebSocketClose = function () {
        estadoConexion.textContent =
            "Conexión interrumpida. Intentando reconectar...";
    };

    cliente.activate();
</script>

</body>
</html>
