<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Votación de Categoría')}"></head>
<body>

<header th:replace="~{header :: navbar}"></header>

<main class="main-content">
    <div class="card voting-card-wrapper">

        <span class="badge badge-warning" style="margin-bottom: 1rem; letter-spacing: 0.04em;">
            FASE DE VOTACIÓN · RONDA <span th:text="${partida.rondaActual}">1</span> / <span th:text="${partida.totalRondas}">5</span>
        </span>

        <div th:if="${!yaVoto}">
            <h1 class="page-title" style="margin-bottom: 0.5rem;">¡Elige la Categoría para esta Ronda!</h1>
            <p class="page-subtitle">
                Vota por tu temática preferida. La categoría con más votos definirá la pregunta.
            </p>

            <form th:action="@{/partida/{id}/votar-categoria(id=${partida.id})}"
                  method="POST"
                  class="voting-grid-3">

                <button th:each="entry : ${mapaDeCategorias}"
                        th:with="nombre=${#strings.toLowerCase(entry.value.nombre)}"
                        type="submit"
                        name="categoriaId"
                        th:value="${entry.key}"
                        class="category-card-vote"
                        th:classappend="${nombre == 'arte'} ? 'cat-arte' :
                                        (${nombre == 'ciencia'} ? 'cat-ciencia' :
                                        (${nombre == 'deportes'} ? 'cat-deportes' :
                                        (${nombre == 'entretenimiento'} ? 'cat-entretenimiento' :
                                        (${#strings.contains(nombre, 'geograf')} ? 'cat-geografia' :
                                        (${nombre == 'historia'} ? 'cat-historia' : 'cat-default')))))">

                    <!-- Ícono -->
                    <i th:if="${nombre == 'arte'}" class="fa-solid fa-palette"></i>
                    <i th:if="${nombre == 'ciencia'}" class="fa-solid fa-flask"></i>
                    <i th:if="${nombre == 'deportes'}" class="fa-solid fa-futbol"></i>
                    <i th:if="${nombre == 'entretenimiento'}" class="fa-solid fa-film"></i>
                    <i th:if="${#strings.contains(nombre, 'geograf')}" class="fa-solid fa-earth-americas"></i>
                    <i th:if="${nombre == 'historia'}" class="fa-solid fa-landmark"></i>
                    <i th:unless="${nombre == 'arte' or nombre == 'ciencia' or nombre == 'deportes' or nombre == 'entretenimiento' or #strings.contains(nombre, 'geograf') or nombre == 'historia'}"
                       class="fa-solid fa-circle-question"></i>

                    <!-- Nombre -->
                    <span class="category-name" th:text="${entry.value.nombre}">Categoría</span>

                    <!-- Descripción -->
                    <span class="category-desc" th:if="${nombre == 'arte'}">
                        Pintura, escultura, arquitectura y grandes obras de la literatura
                    </span>
                    <span class="category-desc" th:if="${nombre == 'ciencia'}">
                        Física, química, biología, astronomía y tecnología
                    </span>
                    <span class="category-desc" th:if="${nombre == 'deportes'}">
                        Fútbol, baloncesto, tenis, juegos olímpicos y atletismo
                    </span>
                    <span class="category-desc" th:if="${nombre == 'entretenimiento'}">
                        Cine, series, música, videojuegos y cultura pop
                    </span>
                    <span class="category-desc" th:if="${#strings.contains(nombre, 'geograf')}">
                        Países, capitales, cordilleras, océanos y mapas
                    </span>
                    <span class="category-desc" th:if="${nombre == 'historia'}">
                        Eventos históricos, civilizaciones antiguas y personajes célebres
                    </span>
                </button>
            </form>
        </div>

        <div th:if="${yaVoto}" style="margin-top: 1.5rem;">
            <div class="alert-box alert-box-info">
                <p style="font-size: 1.1rem; margin-bottom: 0.3rem;">¡Voto registrado!</p>
                <span style="font-weight: 400;">Esperando que el resto de los jugadores termine de votar...</span>
            </div>
        </div>

        <p id="estadoConexion" class="d-none"></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    const partidaId = /*[[${partida.id}]]*/ "";
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const urlIr = /*[[@{/partida/{id}/ir(id=${partida.id})}]]*/ "";
    const urlWs = /*[[@{/ws}]]*/ "/ws";

    const eventosTransicion = [
        "VOTACION_CATEGORIA_FINALIZADA",
        "RONDA_RESULTADO",
        "NUEVA_VOTACION_CATEGORIA",
        "PARTIDA_FINALIZADA"
    ];

    const estadoConexion = document.getElementById("estadoConexion");

    const cliente = new StompJs.Client({
        brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + urlWs,
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        if (estadoConexion) estadoConexion.textContent = "Conectado a la partida.";

        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            if (String(evento.partidaId) !== String(partidaId)) {
                return;
            }

            if (eventosTransicion.includes(evento.tipo)) {
                window.location.href = urlIr;
            }
        });
    };

    cliente.onStompError = function () {
        if (estadoConexion) estadoConexion.textContent = "Error de comunicación con la partida.";
    };

    cliente.onWebSocketClose = function () {
        if (estadoConexion) estadoConexion.textContent = "Conexión interrumpida. Intentando reconectar...";
    };

    cliente.activate();
</script>
</body>
</html>
