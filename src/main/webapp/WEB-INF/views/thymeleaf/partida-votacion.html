<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elegir categoría - TRIVIA</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">

<div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">

        <h1 class="mb-3">TRIVIA</h1>

        <h2 class="mb-4">
            Ronda
            <span th:text="${partida.rondaActual}">1</span>
            /
            <span th:text="${partida.totalRondas}">5</span>
        </h2>

        <h3 class="mb-3">Elegí una categoría</h3>

        <p class="text-muted">
            Cada jugador puede votar una sola vez.
        </p>

        <!-- Registrar un voto -->
        <form th:action="@{/partida/{id}/votar-categoria(id=${partida.id})}"
              method="POST"
              class="d-grid gap-3 mt-3">

            <button th:each="entry : ${mapaDeCategorias}"
                    type="submit"
                    name="categoriaId"
                    th:value="${entry.key}"
                    th:text="${entry.value.nombre}"
                    class="btn btn-primary">
                Categoría
            </button>

        </form>

        <hr class="my-4">

        <!-- Finalizar la votación -->
        <form th:action="@{/partida/{id}/resultado-votacion(id=${partida.id})}"
              method="POST">

            <button type="submit" class="btn btn-success w-100">
                Obtener categoría ganadora
            </button>

        </form>

    </div>
</div>

<!-- WebSocket: avisar a los jugadores que terminó la votación -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>

<script th:inline="javascript">
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const partidaId = /*[[${partida.id}]]*/ "";

    const urlPregunta =
        /*[[@{/partida/{id}/pregunta(id=${partida.id})}]]*/ "";

    const cliente = new StompJs.Client({
        brokerURL: "ws://localhost:8080/spring/ws",
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            if (
                evento.tipo === "VOTACION_CATEGORIA_FINALIZADA" &&
                String(evento.partidaId) === String(partidaId)
            ) {
                window.location.href = urlPregunta;
            }
        });
    };

    cliente.activate();
</script>

</body>
</html>
