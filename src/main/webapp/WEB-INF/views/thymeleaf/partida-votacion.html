<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Votación de Categoría - TRIVIA</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">

<div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">

        <h1 class="mb-3">TRIVIA</h1>

        <h2 class="mb-4">
            Ronda <span th:text="${partida.rondaActual}">1</span>
            / <span th:text="${partida.totalRondas}">5</span>
        </h2>

        <div th:if="${!yaVoto}">
            <h3 class="mb-2">Votación de Categoría</h3>

            <p class="text-muted mb-4">
                Seleccioná la categoría que prefieras para la ronda.
                La temática más votada entre todos los jugadores definirá la próxima pregunta.
            </p>

            <form th:action="@{/partida/{id}/votar-categoria(id=${partida.id})}"
                  method="POST"
                  class="d-grid gap-3 mt-3">
                <button th:each="entry : ${mapaDeCategorias}"
                        type="submit"
                        name="categoriaId"
                        th:value="${entry.key}"
                        th:text="${entry.value.nombre}"
                        class="btn btn-primary py-2 fs-5">
                    Categoría
                </button>
            </form>
        </div>

        <div th:if="${yaVoto}">
            <div class="alert alert-info py-3 mb-0">
                <p class="mb-0 fw-bold">¡Voto registrado!</p>
                <small class="text-muted">Esperando que el resto de los jugadores termine de votar...</small>
            </div>
        </div>

        <p id="estadoConexion" class="text-muted small mt-3">Conectando con la partida...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    const partidaId = /*[[${partida.id}]]*/ "";
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const urlIr = /*[[@{/partida/{id}/ir(id=${partida.id})}]]*/ "";
    const urlWs = /*[[@{/ws}]]*/ "/ws";

    const eventosTransicion = [
        "VOTACION_CATEGORIA_FINALIZADA",
        "RONDA_RESULTADO",
        "NUEVA_VOTACION_CATEGORIA",
        "PARTIDA_FINALIZADA"
    ];

    const estadoConexion = document.getElementById("estadoConexion");

    const cliente = new StompJs.Client({
        brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + urlWs,
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        estadoConexion.textContent = "Conectado a la partida.";

        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            if (String(evento.partidaId) !== String(partidaId)) {
                return;
            }

            if (eventosTransicion.includes(evento.tipo)) {
                window.location.href = urlIr;
            }
        });
    };

    cliente.onStompError = function () {
        estadoConexion.textContent = "Error de comunicación con la partida.";
    };

    cliente.onWebSocketClose = function () {
        estadoConexion.textContent = "Conexión interrumpida. Intentando reconectar...";
    };

    cliente.activate();
</script>
</body>
</html>
