<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Resultado de Ronda')}"></head>
<body>

<header th:replace="~{header :: navbar}"></header>

<main class="main-content">
    <div class="result-wrapper">

        <!-- TARJETA ÚNICA DE RESULTADO -->
        <div class="evaluation-card" th:classappend="${esCorrecta} ? 'is-correct' : 'is-incorrect'">

            <span class="badge badge-purple" style="margin-bottom: 1rem;">
                Ronda <span th:text="${partida.rondaActual}">1</span> / <span th:text="${partida.totalRondas}">5</span>
            </span>

            <!-- Ícono y título principal -->
            <div style="margin-bottom: 0.8rem;">
                <i th:if="${esCorrecta}" class="fa-solid fa-circle-check" style="font-size: 3rem; color: var(--success);"></i>
                <i th:unless="${esCorrecta}" class="fa-solid fa-circle-xmark" style="font-size: 3rem; color: var(--danger);"></i>
            </div>

            <h2 th:if="${esCorrecta}" class="result-title-correct">¡Respuesta Correcta!</h2>
            <h2 th:unless="${esCorrecta}" class="result-title-incorrect">¡Respuesta Incorrecta!</h2>

            <!-- Alerta si se quedó sin tiempo -->
            <p th:if="${fuePorTiempo}" style="color: #D48806; font-weight: 600; margin-bottom: 0.8rem;">
                <i class="fa-solid fa-clock"></i> Te quedaste sin tiempo para responder.
            </p>

            <!-- Respuesta correcta (mostrada una sola vez) -->
            <p style="font-size: 1.1rem; color: var(--text-main); margin: 1rem 0 1.8rem 0;">
                La respuesta correcta era:
                <strong th:text="${textoCorrecto}">Respuesta correcta</strong>
            </p>

            <!-- Botón de avance para el anfitrión -->
            <form th:if="${esHost}"
                  th:action="@{/partida/{id}/siguiente(id=${partida.id})}"
                  method="POST">
                <button type="submit"
                        class="btn"
                        th:classappend="${esCorrecta} ? 'btn-success' : 'btn-primary'"
                        th:text="${esUltimaRonda} ? 'Ver Resultados Finales' : 'Siguiente Ronda'">
                    Siguiente Ronda
                </button>
            </form>

            <p th:unless="${esHost}" style="color: var(--text-muted); font-weight: 500;">
                Esperando a que el anfitrión continúe...
            </p>

            <p id="estadoConexion" class="d-none"></p>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    const partidaId = /*[[${partida.id}]]*/ "";
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const urlIr = /*[[@{/partida/{id}/ir(id=${partida.id})}]]*/ "";
    const urlWs = /*[[@{/ws}]]*/ "/ws";

    const eventosTransicion = [
        "VOTACION_CATEGORIA_FINALIZADA",
        "RONDA_RESULTADO",
        "NUEVA_VOTACION_CATEGORIA",
        "PARTIDA_FINALIZADA"
    ];

    const estadoConexion = document.getElementById("estadoConexion");

    const cliente = new StompJs.Client({
        brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + urlWs,
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        if (estadoConexion) estadoConexion.textContent = "Conectado a la partida.";

        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            if (String(evento.partidaId) !== String(partidaId)) {
                return;
            }

            if (eventosTransicion.includes(evento.tipo)) {
                window.location.href = urlIr;
            }
        });
    };

    cliente.onStompError = function () {
        if (estadoConexion) estadoConexion.textContent = "Error de comunicación con la partida.";
    };

    cliente.onWebSocketClose = function () {
        if (estadoConexion) estadoConexion.textContent = "Conexión interrumpida. Intentando reconectar...";
    };

    cliente.activate();
</script>
</body>
</html>
