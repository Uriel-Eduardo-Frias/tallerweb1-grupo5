<head>
    <meta charset="UTF-8">
    <title>Partida</title>
</head>

<body>

<main>

    <h1>Partida en curso</h1>

    <section>

        <h2>Información de la partida</h2>

        <p>
            Sala:
            <strong th:text="${partida.sala.codigo}">
                ABC123
            </strong>
        </p>

        <p>
            Nombre:
            <strong th:text="${partida.sala.nombre}">
                Trivia del viernes
            </strong>
        </p>

        <p>
            Estado de la partida:
            <strong th:text="${partida.estado}">
                EN_CURSO
            </strong>
        </p>

        <p>
            Estado de la sala:
            <strong th:text="${partida.sala.estado}">
                EN_CURSO
            </strong>
        </p>

    </section>


    <section>

        <h2>Jugadores</h2>

        <ul>
            <li th:each="jugador : ${partida.sala.jugadores}"
                th:text="${jugador.usuario.username}">
                Jugador
            </li>
        </ul>

    </section>



    <form th:action="@{/partidas/{codigoSala}/finalizar(codigoSala=${partida.sala.codigo})}"
          method="post">

        <button type="submit">
            Finalizar partida
        </button>

    </form>

</main>

</body>

</html>
