<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Mis Logros y Medallas')}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">Logros y Desafíos Desbloqueables</h1>
        <p class="page-subtitle">Completa rachas de respuestas, acumula victorias y obtén insignias legendarias para tu perfil.</p>
    </div>

    <div class="logros-grid">
        <div th:each="l : ${logros}"
             class="card logro-card"
             th:classappend="${l.desbloqueado} ? 'desbloqueado' : 'bloqueado'">

            <div class="logro-body">
                <div class="logro-icon">
                    <i class="fa-solid fa-award"></i>
                </div>
                <div class="logro-info">
                    <h3 class="logro-nombre" th:text="${l.nombre}">Nombre Logro</h3>
                    <p class="logro-descripcion" th:text="${l.descripcion}">Descripción del logro</p>
                </div>
            </div>

            <div class="logro-footer">
                    <span th:if="${l.desbloqueado}" class="badge badge-success">
                        <i class="fa-solid fa-check-circle"></i> Desbloqueado
                    </span>
                <span th:unless="${l.desbloqueado}" class="badge badge-warning">
                        <i class="fa-solid fa-lock"></i> Bloqueado
                    </span>

                <small th:if="${l.desbloqueado}" class="logro-fecha" th:text="${l.fechaFormateada}">26/10/2026</small>
            </div>
        </div>
    </div>
</main>
</body>
</html>
