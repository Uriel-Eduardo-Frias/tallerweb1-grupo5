<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Mis Logros y Medallas')}"></head>
<body>
    <header th:replace="~{header :: navbar}"></header>

    <main class="main-content">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; font-weight: 800;">Logros y Desafíos Desbloqueables</h1>
            <p style="color: var(--text-muted);">Completa rachas de respuestas, acumula victorias y obtén insignias legendarias para tu perfil.</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <div th:each="l : ${logros}" class="card" th:style="${l.desbloqueado} ? 'border: 2px solid var(--warning);' : 'opacity: 0.6; filter: grayscale(80%);'">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div style="width: 60px; height: 60px; background: #FEF6E4; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-award" style="font-size: 2rem; color: #D4AC0D;"></i>
                    </div>
                    <div style="flex: 1;">
                        <h3 style="font-size: 1.1rem; margin-bottom: 0.2rem;" th:text="${l.nombre}">Nombre Logro</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.3;" th:text="${l.descripcion}">Descripción del logro</p>
                    </div>
                </div>

                <div style="margin-top: 1.2rem; border-top: 1px solid var(--border-color); padding-top: 0.8rem; display: flex; justify-content: space-between; align-items: center;">
                    <span th:if="${l.desbloqueado}" class="badge badge-success">
                        <i class="fa-solid fa-check-circle"></i> Desbloqueado
                    </span>
                    <span th:unless="${l.desbloqueado}" class="badge badge-warning">
                        <i class="fa-solid fa-lock"></i> Bloqueado
                    </span>
                    <small th:if="${l.desbloqueado and l.fechaDesbloqueo != null}" style="color: var(--text-muted); font-size: 0.75rem;" th:text="${#temporals.format(l.fechaDesbloqueo, 'dd/MM/yyyy')}">Fecha</small>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
