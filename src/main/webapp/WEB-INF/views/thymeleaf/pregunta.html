<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta Activa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .header-bar {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: none;
        }
        .ranking-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: none;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: left;
            padding: 1.25rem;
            width: 100%;
        }
        .option-btn:hover {
            border-color: #6366f1;
            background-color: #f8fafc;
            transform: translateY(-2px);
        }
        .letter-pill {
            width: 36px;
            height: 36px;
            background-color: #f1f5f9;
            color: #475569;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .progress-bar-custom {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #10b981 0%, #f59e0b 50%, #ef4444 100%);
        }
        .badge-categoria {
            background-color: #9333ea;
            color: #ffffff;
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-weight: 600;
        }
        .badge-dificultad {
            background-color: #fef3c7;
            color: #d97706;
            border-radius: 12px;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
        }
        .badge-puntos {
            background-color: #ede9fe;
            color: #6366f1;
            border-radius: 12px;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="py-4">
<div class="container-xl">

    <div class="header-bar p-3 mb-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span class="badge rounded-pill bg-light text-primary border border-primary-subtle px-3 py-2 fw-bold">Ronda 1 / 5</span>
            <span class="badge rounded-pill bg-light text-primary border border-primary-subtle px-3 py-2 fw-semibold">Turno de Todos</span>
            <span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2 fw-bold">PREGUNTA ACTIVA</span>
        </div>
        <div class="d-flex align-items-center text-danger fw-bold fs-5">
            <i class="bi bi-alarm-fill me-2 fs-4"></i>
            <span>13 s</span>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-9">
            <div class="main-card p-4 p-md-5">

                <div class="w-100 bg-light rounded-pill mb-4" style="height: 8px;">
                    <div class="progress-bar-custom w-75"></div>
                </div>

                <div class="d-flex justify-content-center align-items-center gap-2 mb-4" th:if="${pregunta != null}">
                    <span class="badge-categoria small" th:if="${pregunta.categoria != null}">
                        <i class="bi bi-film me-1"></i>
                        <span th:text="${pregunta.categoria.nombre}">Entretenimiento</span>
                    </span>
                    <span class="badge-dificultad small">Dificultad: NORMAL</span>
                    <span class="badge-puntos small">+10 pts</span>
                </div>

                <h3 class="fw-bold text-center text-dark mb-5" th:if="${pregunta != null}" th:text="${pregunta.descripcion}">
                    ¿Cuál es la película más taquillera de la historia del cine?
                </h3>

                <div th:if="${!yaRespondio}">
                    <form th:action="@{/responder}" method="POST">
                        <div class="row row-cols-1 row-cols-md-2 g-3">
                            <div class="col" th:each="op, stat : ${pregunta.opciones}">
                                <button type="submit"
                                        name="opcionId"
                                        th:value="${op.id}"
                                        class="option-btn d-flex align-items-center gap-3">
                                    <span class="letter-pill" th:text="${stat.index == 0 ? 'A' : (stat.index == 1 ? 'B' : (stat.index == 2 ? 'C' : 'D'))}">A</span>
                                    <span class="fw-semibold text-dark fs-5" th:text="${op.texto}">Opción de prueba</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div th:if="${yaRespondio}" class="text-center py-4">
                    <div class="mb-3">
                        <i th:if="${esCorrecta}" class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                        <i th:if="${!esCorrecta}" class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                    </div>

                    <h3 th:if="${esCorrecta != null}"
                        th:class="${esCorrecta ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                        th:text="${esCorrecta ? '¡Respuesta Correcta! (+10 pts)' : '¡Respuesta Incorrecta!'}">
                    </h3>

                    <p class="mt-3 text-secondary fs-5" th:if="${textoCorrecto != null}">
                        La respuesta correcta era: <strong class="text-dark" th:text="${textoCorrecto}">Texto correcto</strong>
                    </p>

                    <a th:href="@{/votacion}" class="btn btn-primary btn-lg mt-4 px-4 py-2 rounded-3">
                        Siguiente Ronda
                    </a>
                </div>

            </div>
        </div>

        <div class="col-lg-3">
            <div class="ranking-card p-3">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-bar-chart-steps text-warning fs-5"></i>
                    <h6 class="fw-bold mb-0 text-dark">Posiciones en Vivo</h6>
                </div>

                <div class="d-flex align-items-center justify-content-between p-2 rounded-3 bg-light">
                    <div class="d-flex align-items-center gap-2">
                        <span class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center" style="width: 34px; height: 34px;">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <span class="fw-semibold small text-dark">Jugador</span>
                    </div>
                    <div class="text-end">
                        <span class="fw-bold text-primary small d-block">0</span>
                        <span class="text-muted" style="font-size: 0.7rem;">pts</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
