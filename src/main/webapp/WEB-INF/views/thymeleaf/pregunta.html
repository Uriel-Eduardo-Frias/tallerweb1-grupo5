<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pregunta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 600px;">

    <div class="card p-4 shadow-sm">

        <!-- Categoría de la pregunta actual -->
        <div class="mb-3 text-end" th:if="${pregunta != null and pregunta.categoria != null}">
            <span class="badge bg-info text-dark fs-6" th:text="${pregunta.categoria.nombre}">Categoría</span>
        </div>

        <!-- 1. Estado: Aún no respondió (Muestra la pregunta y las opciones) -->
        <div th:if="${!yaRespondio}">
            <h4 class="mb-4 text-center" th:text="${pregunta.descripcion}">¿Pregunta?</h4>

            <form th:action="@{/responder}" method="POST" class="d-grid gap-3">
                <!-- Se envía el ID de la opción seleccionada -->
                <button th:each="op : ${pregunta.opciones}"
                        type="submit"
                        name="opcionId"
                        th:value="${op.id}"
                        class="btn btn-outline-primary text-start p-3 fs-5"
                        th:text="${op.texto}">
                    Opción
                </button>
            </form>
        </div>

        <!-- 2. Estado: Ya respondió (Muestra el resultado y feedback) -->
        <div th:if="${yaRespondio}" class="text-center">

            <h3 th:if="${esCorrecta != null}"
                th:class="${esCorrecta ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                th:text="${esCorrecta ? '¡Respuesta Correcta!' : '¡Respuesta Incorrecta!'}">
            </h3>

            <p class="mt-3 text-muted" th:if="${textoCorrecto != null}"
               th:text="'La respuesta correcta era: ' + ${textoCorrecto}">
            </p>

            <a th:href="@{/votacion}" class="btn btn-success btn-lg mt-3">
                Volver a Categorías
            </a>
        </div>

    </div>
</div>
</body>
</html>
