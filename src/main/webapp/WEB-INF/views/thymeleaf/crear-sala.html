<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<main class="main-content" style="max-width: 600px; margin-top: 2rem;">
    <div class="card">
        <h1 class="card-title"><i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i> Configurar Nueva Sala</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Establece la capacidad, el modo de juego y el número de rondas.
        </p>

        <div th:if="${error != null}" class="badge badge-danger" style="display: block; padding: 0.8rem; margin-bottom: 1.2rem; text-align: center;" th:text="${error}">
            Error al crear sala
        </div>

        <form th:action="@{/salas/crear}" th:object="${crearSalaDTO}" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">Nombre de la Sala</label>
                <input type="text" th:field="*{nombre}" style="width: 100%; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px;" placeholder="Ej: Trivia de Amigos, Duelo de Sabios" required>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: var(--danger); font-size: 0.8rem;"></span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">Máximo de Jugadores</label>
                    <select th:field="*{maxJugadores}" style="width: 100%; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px; background: #FFF;">
                        <option value="2">2 Jugadores</option>
                        <option value="4" selected>4 Jugadores</option>
                        <option value="6">6 Jugadores</option>
                        <option value="8">8 Jugadores</option>
                        <option value="10">10 Jugadores</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">Total de Rondas</label>
                    <select th:field="*{totalRondas}" style="width: 100%; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px; background: #FFF;">
                        <option value="3">3 Preguntas (Rápida)</option>
                        <option value="5" selected>5 Preguntas (Estándar)</option>
                        <option value="8">8 Preguntas (Completa)</option>
                        <option value="10">10 Preguntas (Maratón)</option>
                    </select>
                </div>
            </div>

            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">Dinámica de Juego</label>
                <select th:field="*{modoJuego}" style="width: 100%; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px; background: #FFF;">
                    <option value="TURNO_TODOS" selected>Turno de Todos (Todos responden con cronómetro)</option>
                    <option value="PRIMERO_GANA">Primero en Responder Gana (El más veloz se lleva los puntos y cierra la ronda)</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem;">
                <input type="checkbox" th:field="*{esPrivada}" id="privadaCheck" style="width: 18px; height: 18px; accent-color: var(--primary);">
                <label for="privadaCheck" style="font-size: 0.9rem; font-weight: 500; cursor: pointer;">
                    Sala Privada (solo accesible con el código de invitación)
                </label>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Crear y Abrir Lobby</button>
                <a th:href="@{/salas}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
