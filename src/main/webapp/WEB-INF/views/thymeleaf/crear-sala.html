<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Crear Sala')}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main class="main-content" style="max-width: 680px;">

    <a th:href="@{/salas}" class="btn btn-outline-sm" style="margin-bottom: 1.2rem;">
        <i class="fa-solid fa-arrow-left"></i> Volver a las salas
    </a>

    <div class="card">
        <span class="badge badge-purple">NUEVA SALA</span>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin: 0.6rem 0 0.3rem;">
            <i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i> Configurar Nueva Sala
        </h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Establece la capacidad, el modo de juego y el número de rondas.
        </p>

        <div th:if="${error != null}" class="badge badge-danger"
             style="display: block; padding: 0.8rem; margin-bottom: 1.2rem; text-align: center;"
             th:text="${error}">
            Error al crear sala
        </div>

        <form th:action="@{/salas/crear}" th:object="${crearSalaDTO}" method="POST"
              th:with="etiqueta='display:block; font-weight:600; font-size:0.85rem; margin-bottom:0.4rem;',
                       campo='width:100%; border:1px solid var(--border-color); padding:0.8rem; border-radius:8px; background:#FFF; font-size:0.95rem; color:var(--text-main);'"
              style="display: flex; flex-direction: column; gap: 1.2rem;">

            <div>
                <label th:style="${etiqueta}">Nombre de la Sala</label>
                <input type="text" th:field="*{nombre}" th:style="${campo}"
                       placeholder="Ej: Trivia de Amigos, Duelo de Sabios" required>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"
                      style="color: var(--danger); font-size: 0.8rem;"></span>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label th:style="${etiqueta}">Máximo de Jugadores</label>
                    <select th:field="*{maxJugadores}" th:style="${campo}">
                        <option value="2">2 Jugadores</option>
                        <option value="4" selected>4 Jugadores</option>
                        <option value="6">6 Jugadores</option>
                        <option value="8">8 Jugadores</option>
                        <option value="10">10 Jugadores</option>
                    </select>
                </div>

                <div>
                    <label th:style="${etiqueta}">Total de Rondas</label>
                    <select th:field="*{totalRondas}" th:style="${campo}">
                        <option value="3">3 Preguntas (Rápida)</option>
                        <option value="5" selected>5 Preguntas (Estándar)</option>
                        <option value="8">8 Preguntas (Completa)</option>
                        <option value="10">10 Preguntas (Maratón)</option>
                    </select>
                </div>
            </div>

            <div>
                <label th:style="${etiqueta}">Dinámica de Juego</label>
                <select th:field="*{modoJuego}" th:style="${campo}">
                    <option value="TURNO_TODOS" selected>Turno de Todos (Todos responden con cronómetro)</option>
                    <option value="PRIMERO_GANA">Primero en Responder Gana (El más veloz se lleva los puntos y cierra la ronda)</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 0.7rem; padding: 0.9rem 1rem; background: #F8F9FB; border: 1px solid var(--border-color); border-radius: 10px;">
                <input type="checkbox" th:field="*{esPrivada}" id="privadaCheck"
                       style="width: 18px; height: 18px; accent-color: var(--primary);">
                <label for="privadaCheck" style="font-size: 0.9rem; font-weight: 500; cursor: pointer;">
                    <i class="fa-solid fa-lock" style="color: var(--text-muted);"></i>
                    Sala privada (solo accesible con el código de invitación)
                </label>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fa-solid fa-door-open"></i> Crear y Abrir Lobby
                </button>
                <a th:href="@{/salas}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
