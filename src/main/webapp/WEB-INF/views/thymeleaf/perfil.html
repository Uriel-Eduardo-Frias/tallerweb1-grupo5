<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Mi Perfil')}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<main class="main-content">
    <div class="dashboard-grid">
        <div class="card">
            <div style="display: flex; gap: 1.5rem; align-items: center; margin-bottom: 2rem;">

                <img th:if="${perfil.avatarUrl != null}" th:src="${perfil.avatarUrl}" alt="Avatar" style="width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary); background: #FFF; object-fit: cover;">

                <div th:unless="${perfil.avatarUrl != null}" style="width: 90px; height: 90px; border-radius: 50%; background-color: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; border: 3px solid var(--primary);">
                    <i class="fa-solid fa-user-astronaut"></i>
                </div>

                <div>
                    <h1 style="font-size: 1.8rem; font-weight: 800;" th:text="${usuario.username}">Usuario</h1>
                    <span class="badge badge-purple" style="font-size: 0.9rem; margin-top: 0.3rem;" th:text="'Nivel ' + ${perfil.nivel}">Nivel 1</span>
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;" th:text="${perfil.biografia != null} ? ${perfil.biografia} : 'Sin biografía'">Biografía</p>
                </div>
            </div>

            <div style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
                    <span>Progreso de Nivel</span>
                    <span th:text="${perfil.experiencia} + ' XP'">150 XP</span>
                </div>
                <div style="width: 100%; height: 10px; background: #E2E8F0; border-radius: 5px; overflow: hidden;">
                    <div style="height: 100%; background: var(--primary); width: 65%;"></div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

            <h3 style="font-size: 1.1rem; margin-bottom: 1rem;"><i class="fa-solid fa-pen-to-square"></i> Actualizar Perfil</h3>
            <form th:action="@{/perfil/actualizar}" method="POST" accept-charset="UTF-8" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">Biografía</label>
                    <textarea name="biografia" rows="2" style="width: 100%; border: 1px solid var(--border-color); padding: 0.7rem; border-radius: 8px;" th:text="${perfil.biografia}"></textarea>
                </div>
                <div>
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.4rem;">URL del Avatar (imagen o enlace)</label>
                    <input type="text" name="avatarUrl" style="width: 100%; border: 1px solid var(--border-color); padding: 0.7rem; border-radius: 8px;" th:value="${perfil.avatarUrl}">
                </div>
                <button type="submit" class="btn btn-primary-sm" style="align-self: flex-start; padding: 0.6rem 1.5rem;">Guardar Cambios</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title"><i class="fa-solid fa-chart-pie" style="color: var(--primary);"></i> Resumen de Juego</h2>
            <div th:if="${estadistica != null}" style="display: flex; flex-direction: column; gap: 1.2rem;">
            </div>
            <div th:unless="${estadistica != null}" style="color: var(--text-muted); font-size: 0.9rem;">
                Las estadísticas aún no están disponibles. (Pendiente de implementación).
            </div>
        </div>
    </div>
</main>
</body>
</html>
