<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Resultado Final')}"></head>
<body>

<header th:replace="~{header :: navbar}"></header>

<main class="main-content" style="display: flex; flex-direction: column; gap: 2rem;">

    <!-- TARJETA DE PODIO Y ACCIONES -->
    <div class="card" style="text-align: center;">

        <!-- Mensaje de ganador / empate -->
        <div th:if="${!resultado.hayEmpate}" style="margin-bottom: 0.5rem;">
            <span class="badge badge-success">
                <i class="fa-solid fa-trophy"></i> ¡Ganó <strong th:text="${resultado.nombresGanadores}">Jugador</strong>!
            </span>
        </div>
        <div th:if="${resultado.hayEmpate}" style="margin-bottom: 0.5rem;">
            <span class="badge badge-warning">
                <i class="fa-solid fa-handshake"></i> ¡Empate en el primer puesto: <strong th:text="${resultado.nombresGanadores}">Jugadores</strong>!
            </span>
        </div>

        <!-- PODIO (Top 3 desde resultado.jugadores) -->
        <div class="podium-container" style="margin: 2rem 0 1.5rem 0;">
            <div th:each="jugador : ${resultado.jugadores}"
                 th:if="${jugador.posicion <= 3}"
                 class="podium-place"
                 th:classappend="${jugador.posicion == 1} ? 'podium-first' : (${jugador.posicion == 2} ? 'podium-second' : 'podium-third')">

                <div class="podium-avatar">
                    <i class="fa-solid fa-user-astronaut"></i>
                </div>
                <div class="podium-name" th:text="${jugador.nombre}">Jugador</div>
                <div class="podium-pts">
                    <span th:text="${jugador.puntaje}">0</span> pts
                </div>
                <div class="podium-pillar" th:text="${jugador.posicion}">1</div>
            </div>
        </div>

        <!-- BOTONERA DE ACCIONES -->
        <div class="final-actions" style="flex-direction: column; gap: 0.8rem;">
            <div id="zonaRevancha" aria-live="polite"></div>
            <a th:href="@{/salas}" class="btn btn-outline">Volver a las Salas</a>
        </div>

        <!-- Datos resumidos de la partida -->
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 1.5rem;">
            Rondas jugadas: <strong th:text="${resultado.rondasJugadas}">5</strong> / <strong th:text="${resultado.totalRondas}">5</strong>
            · Duración: <strong th:text="${resultado.duracion}">0 min 0 s</strong>
        </p>
    </div>

    <!-- TARJETA DE DESGLOSE DE RENDIMIENTO -->
    <div class="card">
        <h2 class="card-title">Desglose de Rendimiento de la Partida</h2>

        <div style="overflow-x: auto;">
            <table class="styled-table">
                <thead>
                <tr>
                    <th>Puesto</th>
                    <th>Jugador</th>
                    <th>Puntaje</th>
                    <th>Aciertos</th>
                    <th>Errores</th>
                    <th>Racha en Partida</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="jugador : ${resultado.jugadores}"
                    th:style="${jugador.esUsuarioActual} ? 'background: #F5F3FF;' : ''">
                    <td style="font-weight: 800;">
                        #<span th:text="${jugador.posicion}">1</span>
                    </td>
                    <td style="font-weight: 600;">
                        <i class="fa-solid fa-circle-user" style="color: var(--primary); margin-right: 0.4rem;"></i>
                        <span th:text="${jugador.nombre}">Jugador</span>
                        <span th:if="${jugador.esUsuarioActual}" class="badge badge-purple" style="margin-left: 0.4rem;">Vos</span>
                    </td>
                    <td>
                        <span class="badge badge-purple">
                            <span th:text="${jugador.puntaje}">0</span> pts
                        </span>
                    </td>
                    <td style="color: var(--success); font-weight: 700;" th:text="${jugador.aciertos}">0</td>
                    <td style="color: var(--danger); font-weight: 700;" th:text="${jugador.errores}">0</td>
                    <td>
                        <span class="badge badge-warning">
                            <span th:text="${jugador.mejorRacha}">0</span> <i class="fa-solid fa-fire"></i>
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- REVANCHA RÁPIDA -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    (function () {
        const urlBasePartida = /*[[@{/partida}]]*/ "/partida";
        const urlWs = /*[[@{/ws}]]*/ "/ws";

        const coincidencia = window.location.pathname.match(/\/partida\/(\d+)\/fin/);
        const zonaRevancha = document.getElementById("zonaRevancha");

        if (!coincidencia || !zonaRevancha) {
            return;
        }

        const partidaId = coincidencia[1];
        const urlRevancha = urlBasePartida + "/" + partidaId + "/revancha";

        function crearFormulario(accion, texto) {
            const formulario = document.createElement("form");
            formulario.action = accion;
            formulario.method = "POST";

            const boton = document.createElement("button");
            boton.type = "submit";
            boton.className = "btn btn-primary";
            boton.textContent = texto;

            formulario.appendChild(boton);
            return formulario;
        }

        function crearMensajeEspera() {
            const mensaje = document.createElement("span");
            mensaje.style.color = "var(--text-muted)";
            mensaje.style.fontSize = "0.9rem";
            mensaje.textContent = "Esperando a que el anfitrión inicie la revancha...";
            return mensaje;
        }

        function pintarRevancha(estado) {
            zonaRevancha.replaceChildren();

            if (estado.salaRevanchaCodigo) {
                zonaRevancha.appendChild(crearFormulario(urlRevancha + "/unirse", "Ir a la revancha"));
            } else if (estado.esHost) {
                zonaRevancha.appendChild(crearFormulario(urlRevancha, "Jugar de nuevo"));
            } else {
                zonaRevancha.appendChild(crearMensajeEspera());
            }
        }

        function cargarEstadoRevancha() {
            return fetch(urlRevancha + "/estado")
                .then(respuesta => (respuesta.ok ? respuesta.json() : null))
                .then(estado => {
                    if (estado) {
                        pintarRevancha(estado);
                    }
                    return estado;
                });
        }

        function escucharRevancha(codigoSala) {
            const cliente = new StompJs.Client({
                brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + urlWs,
                reconnectDelay: 3000
            });

            cliente.onConnect = function () {
                cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
                    const evento = JSON.parse(mensaje.body);

                    if (String(evento.partidaId) === partidaId && evento.tipo === "REVANCHA_CREADA") {
                        cargarEstadoRevancha();
                    }
                });
            };

            cliente.activate();
        }

        cargarEstadoRevancha().then(estado => {
            if (estado) {
                escucharRevancha(estado.codigoSala);
            }
        });
    })();
</script>

</body>
</html>
