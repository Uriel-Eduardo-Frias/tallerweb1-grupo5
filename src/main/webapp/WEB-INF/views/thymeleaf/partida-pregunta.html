<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Pregunta')}"></head>
<body>

<header th:replace="~{header :: navbar}"></header>

<main class="main-content">
    <div class="game-single-column">

        <!-- BARRA SUPERIOR DE ESTADO -->
        <div class="game-top-bar">
            <div class="game-top-badges">
                <span class="badge badge-purple">
                    Ronda <span th:text="${ronda.numero}">1</span> / <span th:text="${partida.totalRondas}">5</span>
                </span>
                <span class="badge badge-info"
                      th:text="${partida.modoJuego.name() == 'TURNO_TODOS'} ? 'Turno de Todos' : 'Primero Gana'">
                    Turno de Todos
                </span>
                <span class="round-status" th:text="${yaRespondio} ? 'RESPUESTA ENVIADA' : 'PREGUNTA ACTIVA'">
                    PREGUNTA ACTIVA
                </span>
            </div>

            <div class="timer-readout" th:if="${!yaRespondio}">
                <span id="segundosRestantes">15</span><small>s</small>
            </div>
        </div>

        <!-- TARJETA PRINCIPAL DE PREGUNTA -->
        <div class="question-card">

            <!-- BARRA DE TIEMPO -->
            <div class="timer-bar-container" style="margin-bottom: 1.8rem;" th:if="${!yaRespondio}">
                <div id="barraTiempo" class="timer-bar" style="width: 100%;"></div>
            </div>

            <!-- CATEGORÍA -->
            <div th:if="${pregunta.categoria != null}">
                <span class="category-tag" style="background: var(--info);" th:text="${pregunta.categoria.nombre}">
                    Categoría
                </span>
            </div>

            <!-- ENUNCIADO -->
            <h2 class="question-text" th:text="${pregunta.descripcion}">Enunciado de la pregunta</h2>

            <!-- ALERTAS DE ESTADO -->
            <div th:if="${falloPrimerIntentoDobleChance}" class="alert-box alert-box-warning">
                ⚠️ ¡Respuesta incorrecta! Gracias a tu <strong>Doble Chance</strong> tenés un segundo intento. ¡Elegí otra opción!
            </div>

            <div th:if="${errorBloqueo}" class="alert-box alert-box-danger" th:text="${errorBloqueo}">
                🧊 ¡Estás congelado por un comodín!
            </div>

            <!-- FORMULARIO DE OPCIONES (2x2 con letras A, B, C, D) -->
            <form id="formRespuesta"
                  th:if="${!yaRespondio}"
                  th:action="@{/partida/{id}/responder(id=${partida.id})}"
                  method="POST"
                  class="options-grid"
                  style="transition: filter 0.3s ease;">
                <button th:each="opcion, iterStat : ${pregunta.opciones}"
                        type="submit"
                        name="opcionId"
                        th:id="'opcion-' + ${opcion.id}"
                        th:value="${opcion.id}"
                        th:disabled="${opcionFalladaId != null and opcionFalladaId == opcion.id}"
                        th:classappend="${opcionFalladaId != null and opcionFalladaId == opcion.id} ? 'incorrect' : ''"
                        class="option-btn boton-opcion">
                    <span class="option-letter"
                          th:text="${#strings.substring('ABCDEFGH', iterStat.index, iterStat.index + 1)}">A</span>
                    <span th:text="${opcion.texto}" style="flex: 1;">Opción de respuesta</span>
                </button>
            </form>

            <form id="formTiempoAgotado"
                  th:if="${!yaRespondio}"
                  th:action="@{/partida/{id}/tiempo-agotado(id=${partida.id})}"
                  method="POST"
                  style="display: none;">
            </form>

            <!-- SECCIÓN DE COMODINES -->
            <div th:if="${!yaRespondio}">
                <!-- 1. MODO TRADICIONAL (TURNO_TODOS) -->
                <div th:if="${partida.modoJuego.name() == 'TURNO_TODOS'}" class="powerups-bar" style="flex-wrap: wrap;">
                    <button type="button"
                            id="btn5050"
                            th:disabled="${!puede5050}"
                            th:classappend="${!puede5050} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usar5050()">
                        50/50 (-5s)
                        <span th:if="${nivelJugador != null and nivelJugador < 3}" class="badge badge-danger">Nvl 3</span>
                        <span th:if="${(nivelJugador == null or nivelJugador >= 3) and !puede5050}" class="badge">No disp.</span>
                    </button>

                    <button type="button"
                            id="btnTiempoExtra"
                            th:disabled="${!puedeTiempo}"
                            th:classappend="${!puedeTiempo} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usarTiempoExtra()">
                        +10s
                        <span th:if="${!puedeTiempo}" class="badge">No disp.</span>
                    </button>

                    <button type="button"
                            id="btnDobleChance"
                            th:disabled="${!puedeDobleChance}"
                            th:classappend="${!puedeDobleChance} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usarDobleChance()">
                        2x Chance
                        <span th:if="${nivelJugador != null and nivelJugador < 2}" class="badge badge-danger">Nvl 2</span>
                        <span th:if="${(nivelJugador == null or nivelJugador >= 2) and !puedeDobleChance}" class="badge">No disp.</span>
                    </button>
                </div>

                <!-- 2. MODO RÁPIDO (PRIMERO_GANA) -->
                <div th:if="${partida.modoJuego.name() == 'PRIMERO_GANA'}" class="powerups-bar" style="flex-wrap: wrap;">
                    <button type="button"
                            id="btnBorroso"
                            th:disabled="${!puedeBorroso}"
                            th:classappend="${!puedeBorroso} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usarBorroso()">
                        💨 Borroso (5s)
                        <span th:if="${!puedeBorroso}" class="badge">No disp.</span>
                    </button>

                    <button type="button"
                            id="btnMezclar"
                            th:disabled="${!puedeMezclar}"
                            th:classappend="${!puedeMezclar} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usarMezclar()">
                        🔀 Mezclar
                        <span th:if="${nivelJugador != null and nivelJugador < 2}" class="badge badge-danger">Nvl 2</span>
                        <span th:if="${(nivelJugador == null or nivelJugador >= 2) and !puedeMezclar}" class="badge">No disp.</span>
                    </button>

                    <button type="button"
                            id="btnBloqueo"
                            th:disabled="${!puedeBloqueo}"
                            th:classappend="${!puedeBloqueo} ? 'used-or-locked' : ''"
                            class="powerup-btn"
                            onclick="usarBloqueo()">
                        🧊 Bloqueo (10s)
                        <span th:if="${nivelJugador != null and nivelJugador < 3}" class="badge badge-danger">Nvl 3</span>
                        <span th:if="${(nivelJugador == null or nivelJugador >= 3) and !puedeBloqueo}" class="badge">No disp.</span>
                    </button>
                </div>

                <div id="alertaComodin" class="powerup-notice d-none"></div>
            </div>

            <!-- MENSAJE DE ESPERA SI YA RESPONDIÓ -->
            <div th:if="${yaRespondio}" class="alert-box alert-box-info" style="margin-top: 1rem;">
                Respuesta registrada. Esperando a los demás jugadores...
            </div>

            <p id="estadoConexion" class="d-none"></p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
    const partidaId = /*[[${partida.id}]]*/ "";
    const codigoSala = /*[[${partida.sala.codigo}]]*/ "";
    const urlIr = /*[[@{/partida/{id}/ir(id=${partida.id})}]]*/ "";
    const urlWs = /*[[@{/ws}]]*/ "/ws";
    const yaRespondio = /*[[${yaRespondio}]]*/ false;
    const miUsername = /*[[${session.USERNAME}]]*/ "";

    let tiempoRestante = 15;
    const tiempoMaximoBase = 15;
    const barra = document.getElementById("barraTiempo");
    const labelSegundos = document.getElementById("segundosRestantes");
    const alertaComodin = document.getElementById("alertaComodin");

    function actualizarCronometroVisual() {
        if (!labelSegundos || !barra) return;
        labelSegundos.textContent = tiempoRestante;
        const porcentaje = Math.min(100, Math.max(0, (tiempoRestante / tiempoMaximoBase) * 100));
        barra.style.width = porcentaje + "%";
    }

    let intervalReloj = null;

    if (!yaRespondio) {
        intervalReloj = setInterval(() => {
            tiempoRestante--;
            actualizarCronometroVisual();

            if (tiempoRestante <= 0) {
                clearInterval(intervalReloj);
                mostrarMensajeComodin("¡Tiempo agotado!");
                document.querySelectorAll(".boton-opcion").forEach(b => b.disabled = true);

                const formTiempo = document.getElementById("formTiempoAgotado");
                if (formTiempo) {
                    formTiempo.submit();
                }
            }
        }, 1000);
    }

    function mostrarMensajeComodin(mensaje) {
        if (alertaComodin) {
            alertaComodin.textContent = mensaje;
            alertaComodin.classList.remove("d-none");
        }
    }

    function desactivarTodosLosComodines(comodinUsadoId) {
        const ids = ["btn5050", "btnTiempoExtra", "btnDobleChance", "btnBorroso", "btnMezclar", "btnBloqueo"];
        ids.forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.disabled = true;
            btn.classList.add("used-or-locked");
            if (id === comodinUsadoId) {
                if (!btn.innerHTML.includes("Usado")) {
                    btn.innerHTML += ' <span class="badge">Usado</span>';
                }
            } else {
                if (!btn.innerHTML.includes("1/ronda")) {
                    btn.innerHTML += ' <span class="badge">1/ronda</span>';
                }
            }
        });
    }

    // --- COMODINES MODO TRADICIONAL ---
    function usar5050() {
        const url = /*[[@{/partida/{id}/comodin/50-50(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(data => {
                data.opcionesDescartadas.forEach(id => {
                    const btnOpcion = document.getElementById("opcion-" + id);
                    if (btnOpcion) btnOpcion.style.display = "none";
                });
                tiempoRestante = Math.max(2, tiempoRestante - data.penalizacionSegundos);
                actualizarCronometroVisual();
                desactivarTodosLosComodines("btn5050");
                mostrarMensajeComodin("50/50 aplicado: 2 opciones descartadas (-" + data.penalizacionSegundos + "s)");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    function usarTiempoExtra() {
        const url = /*[[@{/partida/{id}/comodin/tiempo-extra(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(data => {
                tiempoRestante += data.segundosExtra;
                actualizarCronometroVisual();
                desactivarTodosLosComodines("btnTiempoExtra");
                mostrarMensajeComodin("¡+10 segundos agregados al cronómetro!");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    function usarDobleChance() {
        const url = /*[[@{/partida/{id}/comodin/doble-chance(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(() => {
                desactivarTodosLosComodines("btnDobleChance");
                mostrarMensajeComodin("Doble Chance activa: tendrás un intento extra si fallas");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    // --- COMODINES MODO RÁPIDO ---
    function usarBloqueo() {
        const url = /*[[@{/partida/{id}/comodin/bloqueo(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(() => {
                desactivarTodosLosComodines("btnBloqueo");
                mostrarMensajeComodin("¡Has congelado al oponente por 10 segundos!");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    function usarBorroso() {
        const url = /*[[@{/partida/{id}/comodin/borroso(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(() => {
                desactivarTodosLosComodines("btnBorroso");
                mostrarMensajeComodin("¡Has nublado la pantalla del rival por 5 segundos!");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    function usarMezclar() {
        const url = /*[[@{/partida/{id}/comodin/mezclar(id=${partida.id})}]]*/ "";
        fetch(url, { method: "POST" })
            .then(async res => {
                if (!res.ok) {
                    const errorJson = await res.json().catch(() => ({}));
                    throw new Error(errorJson.error || "No se pudo aplicar el comodín.");
                }
                return res.json();
            })
            .then(() => {
                desactivarTodosLosComodines("btnMezclar");
                mostrarMensajeComodin("¡Has mezclado las opciones del rival!");
            })
            .catch(err => mostrarMensajeComodin(err.message));
    }

    // --- EFECTOS RECIBIDOS DEL OPONENTE ---
    function activarEfectoBloqueo(segundos) {
        const botones = document.querySelectorAll(".boton-opcion");
        botones.forEach(b => b.disabled = true);
        mostrarMensajeComodin("🧊 ¡El oponente te congeló por " + segundos + " segundos!");

        setTimeout(() => {
            botones.forEach(b => b.disabled = false);
            mostrarMensajeComodin("¡Te has descongelado!");
        }, segundos * 1000);
    }

    function activarEfectoBorroso(segundos) {
        const formResp = document.getElementById("formRespuesta");
        if (formResp) formResp.style.filter = "blur(8px)";
        mostrarMensajeComodin("💨 ¡El oponente nubló tu pantalla por " + segundos + " segundos!");

        setTimeout(() => {
            if (formResp) formResp.style.filter = "none";
            mostrarMensajeComodin("Tu vista se ha aclarado.");
        }, segundos * 1000);
    }

    function activarEfectoMezclar() {
        const contenedor = document.getElementById("formRespuesta");
        if (!contenedor) return;
        for (let i = contenedor.children.length; i >= 0; i--) {
            contenedor.appendChild(contenedor.children[Math.random() * i | 0]);
        }
        mostrarMensajeComodin("🔀 ¡El oponente desordenó tus respuestas!");
    }

    const eventosTransicion = [
        "VOTACION_CATEGORIA_FINALIZADA",
        "RONDA_RESULTADO",
        "NUEVA_VOTACION_CATEGORIA",
        "PARTIDA_FINALIZADA"
    ];

    const estadoConexion = document.getElementById("estadoConexion");

    const cliente = new StompJs.Client({
        brokerURL: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + urlWs,
        reconnectDelay: 3000
    });

    cliente.onConnect = function () {
        if (estadoConexion) estadoConexion.textContent = "Conectado a la partida.";

        cliente.subscribe("/topic/salas/" + codigoSala, function (mensaje) {
            const evento = JSON.parse(mensaje.body);

            if (String(evento.partidaId) !== String(partidaId)) {
                return;
            }

            if (evento.jugadores && evento.jugadores.includes(miUsername)) {
                if (evento.tipo === "BLOQUEO") {
                    activarEfectoBloqueo(10);
                } else if (evento.tipo === "BORROSO") {
                    activarEfectoBorroso(5);
                } else if (evento.tipo === "MEZCLAR") {
                    activarEfectoMezclar();
                }
                return;
            }

            if (eventosTransicion.includes(evento.tipo)) {
                if (intervalReloj) clearInterval(intervalReloj);
                window.location.href = urlIr;
            }
        });
    };

    cliente.onStompError = function () {
        if (estadoConexion) estadoConexion.textContent = "Error de comunicación con la partida.";
    };

    cliente.onWebSocketClose = function () {
        if (estadoConexion) estadoConexion.textContent = "Conexión interrumpida. Intentando reconectar...";
    };

    cliente.activate();

    if (yaRespondio) {
        setInterval(() => {
            window.location.href = urlIr;
        }, 2000);
    }
</script>
</body>
</html>
