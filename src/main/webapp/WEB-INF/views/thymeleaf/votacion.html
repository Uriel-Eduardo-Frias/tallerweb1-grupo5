<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Elegir Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
<div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-2">Seleccioná una Categoría</h2>
        <p class="text-muted">Ronda <span th:text="${rondaActual}">1</span></p>

        <form th:action="@{/partida/iniciar-pregunta}" method="POST" class="d-grid gap-3 mt-3">
            <button th:each="cat : ${categorias}"
                    type="submit"
                    name="categoriaId"
                    th:value="${cat.id}"
                    class="btn btn-primary btn-lg"
                    th:text="${cat.nombre}">
                Ciencia
            </button>
        </form>
    </div>
</div>
</body>
</html>
