<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Elegir Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
<div class="container text-center" style="max-width: 600px;">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-2">Seleccioná una Categoría</h2>

        <form th:action="@{/iniciar-pregunta}" method="POST" class="d-grid gap-3 mt-3">
            <button th:each="entry : ${mapaDeCategorias}"
                    type="submit"
                    name="categoriaId"
                    th:value="${entry.key}"
                    class="btn btn-outline-primary btn-lg p-3 text-start fw-semibold"
                    th:text="${entry.value.nombre}">
                Categoría
            </button>
        </form>
    </div>
</div>
</body>
</html>
