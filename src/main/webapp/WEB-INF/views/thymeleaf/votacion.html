<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación de Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .header-bar {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: none;
        }
        .ranking-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: none;
        }
        .category-btn {
            background: #ffffff;
            border-radius: 16px;
            border-width: 2px;
            border-style: solid;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            text-align: center;
            height: 100%;
        }
        .category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
        .cat-arte { border-color: #facc15; }
        .cat-arte .cat-icon { color: #eab308; }
        .cat-ciencia { border-color: #22c55e; }
        .cat-ciencia .cat-icon { color: #16a34a; }
        .cat-deportes { border-color: #ef4444; }
        .cat-deportes .cat-icon { color: #dc2626; }
        .cat-entretenimiento { border-color: #a855f7; }
        .cat-entretenimiento .cat-icon { color: #9333ea; }
        .cat-geografia { border-color: #0ea5e9; }
        .cat-geografia .cat-icon { color: #0284c7; }
        .cat-historia { border-color: #f97316; }
        .cat-historia .cat-icon { color: #ea580c; }
        .btn-purple {
            background-color: #6366f1;
            color: white;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-purple:hover {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body class="py-4">
<div class="container-xl">

    <div class="header-bar p-3 mb-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span class="badge rounded-pill bg-light text-primary border border-primary-subtle px-3 py-2 fw-bold">Ronda 1 / 5</span>
            <span class="badge rounded-pill bg-light text-primary border border-primary-subtle px-3 py-2 fw-semibold">Turno de Todos</span>
            <span class="badge rounded-pill bg-emerald-subtle text-success border border-success-subtle px-3 py-2 fw-bold">VOTACION CATEGORIA</span>
        </div>
        <div class="d-flex align-items-center text-danger fw-bold fs-5">
            <i class="bi bi-alarm-fill me-2 fs-4"></i>
            <span>20 s</span>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-9">
            <div class="main-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill fw-bold text-uppercase mb-2">Fase de Votación</span>
                    <h2 class="fw-bold text-dark mt-1">¡Elige la Categoría para esta Ronda!</h2>
                    <p class="text-muted small">Vota por tu temática preferida. La categoría con más votos definirá la pregunta.</p>
                </div>

                <form th:action="@{/iniciar-pregunta}" method="POST">
                    <div class="row row-cols-1 row-cols-md-3 g-3 mb-4">
                        <div class="col" th:each="entry, iter : ${mapaDeCategorias}">
                            <button type="submit"
                                    name="categoriaId"
                                    th:value="${entry.key}"
                                    class="category-btn w-100 p-4 d-flex flex-column align-items-center justify-content-center"
                                    th:classappend="${iter.index == 0 ? 'cat-arte' :
                                                    (iter.index == 1 ? 'cat-ciencia' :
                                                    (iter.index == 2 ? 'cat-deportes' :
                                                    (iter.index == 3 ? 'cat-entretenimiento' :
                                                    (iter.index == 4 ? 'cat-geografia' : 'cat-historia'))))}">

                                <div class="cat-icon fs-1 mb-2">
                                    <i th:if="${iter.index == 0}" class="bi bi-palette-fill"></i>
                                    <svg th:if="${iter.index == 1}" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M2.5 1a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H12v2.293l3.854 7.708A1 1 0 0 1 15 13H1a1 1 0 0 1-.854-1.5L4 3.793V1.5H3a.5.5 0 0 1-.5-.5z"/>
                                    </svg>
                                    <i th:if="${iter.index == 2}" class="bi bi-trophy-fill"></i>
                                    <i th:if="${iter.index == 3}" class="bi bi-film"></i>
                                    <i th:if="${iter.index == 4}" class="bi bi-globe-americas"></i>
                                    <i th:if="${iter.index == 5}" class="bi bi-bank2"></i>
                                </div>

                                <h5 class="fw-bold text-dark mb-1" th:text="${entry.value.nombre}">Categoría</h5>
                                <span class="text-muted small">Temática general para responder preguntas</span>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button type="submit" class="btn btn-purple px-4 py-2 d-flex align-items-center gap-2">
                            <i class="bi bi-play-fill fs-5"></i> Continuar a la Pregunta
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="ranking-card p-3">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-bar-chart-steps text-warning fs-5"></i>
                    <h6 class="fw-bold mb-0 text-dark">Posiciones en Vivo</h6>
                </div>

                <div class="d-flex align-items-center justify-content-between p-2 rounded-3 bg-light">
                    <div class="d-flex align-items-center gap-2">
                        <span class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center" style="width: 34px; height: 34px;">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <span class="fw-semibold small text-dark">Jugador</span>
                    </div>
                    <div class="text-end">
                        <span class="fw-bold text-primary small d-block">0</span>
                        <span class="text-muted" style="font-size: 0.7rem;">pts</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
