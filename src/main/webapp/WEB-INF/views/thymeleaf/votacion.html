<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Elegir Categoría</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
<form th:action="@{/partida/{id}/votar-categoria(id=${partida.id})}"
      method="POST"
      class="d-grid gap-3 mt-3">

    <button th:each="entry : ${mapaDeCategorias}"
            type="submit"
            name="categoriaId"
            th:value="${entry.key}"
            th:text="${entry.value.nombre}">
        Categoría
    </button>

</form>
</body>
</html>
