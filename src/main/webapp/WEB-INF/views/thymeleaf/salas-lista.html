<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: head('Salas')}"></head>
<body>
<header th:replace="~{header :: navbar}"></header>

<!-- Estilos propios de la lista (header, tabla, estado vacío) -->
<link rel="stylesheet" th:href="@{/resources/core/css/salas-lista.css}">

<main class="main-content">

    <section class="salas-header">
        <div>
            <h1>Lobbies de Partidas</h1>
            <p>Únete a una sala abierta o crea la tuya para jugar con amigos.</p>
        </div>

        <a th:href="@{/salas/crear}" class="btn btn-primary">
            <i class="fa-solid fa-circle-plus"></i> Crear Nueva Sala
        </a>
    </section>

    <section class="card">

        <div th:if="${#lists.isEmpty(salas)}" class="empty-state">
            <i class="fa-solid fa-door-closed" style="font-size: 2.5rem; color: var(--primary-light); margin-bottom: 1rem;"></i>
            <h2>Todavía no hay salas</h2>
            <p>Cuando haya salas disponibles, aparecerán acá.</p>
        </div>

        <div th:unless="${#lists.isEmpty(salas)}" class="table-container">
            <table class="styled-table">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre de sala</th>
                    <th>Host</th>
                    <th>Jugadores</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="s : ${salas}">
                    <td>
                        <span class="badge badge-purple" th:text="${s.codigo}">TRV-1234</span>
                    </td>

                    <td><strong th:text="${s.nombre}">Trivia del viernes</strong></td>

                    <td th:text="${s.host.username}">Juan</td>

                    <td>
                        <span th:text="${#lists.size(s.jugadores)}">1</span>/<span th:text="${s.maxJugadores}">4</span>
                    </td>

                    <td>
                        <span th:if="${#lists.size(s.jugadores) < s.maxJugadores}" class="badge badge-success">
                            <i class="fa-solid fa-circle-check"></i>&nbsp;Disponible
                        </span>
                        <span th:if="${#lists.size(s.jugadores) >= s.maxJugadores}" class="badge badge-warning">
                            <i class="fa-solid fa-users"></i>&nbsp;Completa
                        </span>
                    </td>

                    <td>
                        <form class="join-form"
                              th:action="@{/salas/{codigo}/unirse(codigo=${s.codigo})}"
                              method="post">
                            <button type="submit"
                                    class="btn-primary-sm"
                                    style="border: 0; cursor: pointer;"
                                    th:disabled="${#lists.size(s.jugadores) >= s.maxJugadores}">
                                Unirse
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
