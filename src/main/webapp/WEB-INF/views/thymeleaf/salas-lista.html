<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salas de Trivia</title>
</head>
<body>
<main>
    <!--
    <h1>Salas de Trivia</h1>
    <p th:text="${mensaje}">Mensaje de ejemplo.</p>
    -->

    <ul>
        <li th:each="sala : ${salas}"
            th:text="${sala.nombre + ' — host: ' + sala.usuario.username}">
            Nombre de sala — host: usuario
        </li>
    </ul>
</main>
</body>
</html>
