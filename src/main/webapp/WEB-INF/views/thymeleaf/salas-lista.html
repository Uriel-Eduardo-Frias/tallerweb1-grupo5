    <header class="main-header">
        <div class="header-container">
            <a class="brand-logo" th:href="@{/salas}">
                <span>Trivia<span class="brand-accent">Web</span></span>
            </a>

            <nav class="nav-links">
                <a th:href="@{/salas}">Salas</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="salas-header">
            <div>
                <h1>Salas de Trivia</h1>
                <p>Elegí una sala disponible y sumate a la partida.</p>
            </div>

            <a th:href="@{/salas/crear}" class="btn btn-primary">
                Crear sala
            </a>
        </section>

        <section class="card">
            <div th:if="${#lists.isEmpty(salas)}" class="empty-state">
                <h2>Todavía no hay salas</h2>
                <p>Cuando haya salas disponibles, aparecerán acá.</p>
            </div>

            <div th:unless="${#lists.isEmpty(salas)}" class="table-container">
                <table class="styled-table">
                    <thead>
                    <tr>
                        <th>Código</th>
                        <th>Sala</th>
                        <th>Host</th>
                        <th>Jugadores</th>
                        <th>Estado</th>
                        <th>Unirse</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="s : ${salas}">
                        <td>
                            <span class="badge badge-purple"
                                  th:text="${s.codigo}">
                                TRV-1234
                            </span>
                        </td>

                        <td th:text="${s.nombre}">Trivia del viernes</td>

                        <td th:text="${s.host.username}">Juan</td>

                        <td>
                            <span th:text="${#lists.size(s.jugadores)}">1</span>
                            /
                            <span th:text="${s.maxJugadores}">4</span>
                        </td>

                        <td>
                            <span th:if="${#lists.size(s.jugadores) < s.maxJugadores}"
                                  class="badge badge-success">
                                Disponible
                            </span>

                            <span th:if="${#lists.size(s.jugadores) >= s.maxJugadores}"
                                  class="badge badge-warning">
                                Completa
                            </span>
                        </td>

                        <td>
                            <form class="join-form"
                                  th:action="@{/salas/unirse}"
                                  method="post">
                                <input type="hidden"
                                       name="codigo"
                                       th:value="${s.codigo}">

                                <input type="text"
                                       name="invitado"
                                       placeholder="Tu nombre"
                                       required>

                                <button type="submit"
                                        class="btn-primary-sm"
                                        th:disabled="${#lists.size(s.jugadores) >= s.maxJugadores}">
                                    Unirse
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    </body>
