<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear sala | TriviaWeb</title>

    <link rel="stylesheet"
          th:href="@{/resources/core/css/salas.css}">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a class="brand-logo" th:href="@{/salas}">
            Trivia<span class="brand-accent">Web</span>
        </a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a th:href="@{/salas}">Salas</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <section class="card" aria-labelledby="page-title">
        <h1 id="page-title">Crear una sala</h1>
        <p>Completá los datos para preparar la partida.</p>

        <form th:action="@{/salas/crear}" method="post">
            <div class="form-field">
                <label for="nombre">Nombre de la sala</label>
                <input id="nombre"
                       name="nombre"
                       type="text"
                       maxlength="60"
                       autocomplete="off"
                       required>
            </div>

            <div class="form-field">
                <label for="host">Tu nombre</label>
                <input id="host"
                       name="host"
                       type="text"
                       maxlength="30"
                       autocomplete="nickname"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Crear sala
            </button>
        </form>
    </section>
</main>
</body>
</html>
