name: Despliegue automático a InfinityFree

on:
  push:
    branches:
      - master # Cambia a 'main' si ese es el nombre de tu rama principal

jobs:
  web-deploy:
    name: Desplegar vía FTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener última versión del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Permite detectar solo los archivos que cambiaron

      - name: Sincronizar archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/ # Ruta de destino en InfinityFree
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.idea/**
            **/node_modules/**
            .gitignore
            README.md
